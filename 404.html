<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Andrew Hill</title>
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            color: #535961;
            background-color: #FDFDFD;
            padding-top: 50px;
            text-align: center;
        }
        .container {
            max-width: 1000px;
            margin: 10px auto 20px;
            padding: 20px 4%;
            background-color: #FDFDFD;
        }
        h1 {
            margin-bottom: 5px;
            margin-top: 15px;
            color: #535961;
        }
        p {
            font-weight: 400;
            margin-bottom: 1em;
        }
        a {
            text-decoration: none;
            color: #007fff;
        }
        a:hover {
            text-decoration: underline;
        }
        .error-code {
            font-size: 6em;
            margin: 0;
            color: #007fff;
        }
        .social-media-links {
            margin-top: 20px;
        }
        .social-media-links img {
            height: 40px;
            display: inline-block;
            margin: 0 10px;
            background-color: #FDFDFD;
        }
        .social-media-links img:hover {
            transform: scale(1.05);
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 20px 0;
        }
        li {
            margin: 10px 0;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007fff;
            color: #FDFDFD;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .button:hover {
            background-color: #0056b3;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="error-code">404</h1>
        <h2>Page Not Found</h2>
        <p>Oops! We couldn't find the page you're looking for...</p>
        <ul>
            <li><a href="/" class="button">Return to Homepage</a></li>
            <li><a href="/documents/Hill_A CV.pdf" class="button">View CV</a></li>
        </ul>
    </div>
</body>
</html>
